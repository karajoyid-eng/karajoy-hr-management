name: Build Karajoy HR Management APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick unzip rsync python3
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q gradle-8.9-bin.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Verify HR files
        shell: bash
        run: |
          set -euo pipefail
          HTML_FILE="Karajoy_HR_System_Opening_Video_AutoPlay_Fix.html"
          ICON_FILE="Karajoy_icon.png"

          if [[ ! -f "$HTML_FILE" ]]; then
            echo "::error::File HTML utama tidak ditemukan: $HTML_FILE"
            find . -maxdepth 5 -type f -iname '*.html' -not -path './.git/*' -print
            exit 1
          fi

          if [[ ! -f "$ICON_FILE" ]]; then
            echo "::error::Ikon tidak ditemukan: $ICON_FILE"
            exit 1
          fi

          echo "HTML_FILE=$HTML_FILE" >> "$GITHUB_ENV"
          echo "ICON_FILE=$ICON_FILE" >> "$GITHUB_ENV"

      - name: Create Android project and patch salary-slip buttons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/karajoy/hr
          mkdir -p app/src/main/res/values

          rsync -a ./ app/src/main/assets/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='app/' \
            --exclude='build/' \
            --exclude='.gradle/' \
            --exclude='*.yml' \
            --exclude='*.yaml' \
            --exclude='gradle.properties'

          cp "$HTML_FILE" app/src/main/assets/index.html

          # Patch only the APK's copied HTML asset. The source HTML and Supabase are untouched.
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/src/main/assets/index.html")
          source = path.read_text(encoding="utf-8")

          match = re.search(
              r"(const\s+slipHtml\s*=\s*`)(.*?)(`\s*;\s*const\s+w\s*=\s*window\.open)",
              source,
              flags=re.DOTALL,
          )
          if not match:
              raise SystemExit("::error::Template slipHtml tidak ditemukan; file HTML tidak diubah.")

          prefix, slip, suffix = match.group(1), match.group(2), match.group(3)

          toolbar = (
              '<div class="toolbar">'
              '<button type="button" onclick="cetakSlipGaji()">Cetak / Simpan sebagai PDF</button>'
              '<button type="button" class="close" onclick="tutupSlipGaji()">Tutup</button>'
              '</div>'
          )

          slip, replaced = re.subn(
              r'<div\s+class="toolbar">.*?</div>',
              lambda _m: toolbar,
              slip,
              count=1,
              flags=re.DOTALL,
          )
          if replaced != 1:
              raise SystemExit("::error::Toolbar slip gaji tidak ditemukan; file HTML tidak diubah.")

          handlers = r'''<script>
          function cetakSlipGaji(){
            try {
              if(window.AndroidHost && typeof window.AndroidHost.printPage === 'function'){
                window.AndroidHost.printPage();
                return;
              }
            } catch(e){}
            try {
              if(window.opener && window.opener.AndroidHost && typeof window.opener.AndroidHost.printSlip === 'function'){
                window.opener.AndroidHost.printSlip();
                return;
              }
            } catch(e){}
            try {
              window.focus();
              window.print();
            } catch(e) {
              alert('Fitur cetak tidak tersedia di tampilan ini.');
            }
          }

          function tutupSlipGaji(){
            try {
              if(window.AndroidHost && typeof window.AndroidHost.closeWindow === 'function'){
                window.AndroidHost.closeWindow();
                return;
              }
            } catch(e){}
            try {
              if(window.opener && window.opener.AndroidHost && typeof window.opener.AndroidHost.closeSlip === 'function'){
                window.opener.AndroidHost.closeSlip();
                return;
              }
            } catch(e){}
            try {
              if(window.opener && !window.opener.closed){
                window.close();
                return;
              }
            } catch(e){}
            try {
              if(history.length > 1){
                history.back();
                return;
              }
            } catch(e){}
            alert('Gunakan tombol Kembali Android untuk menutup slip ini.');
          }
          <\/script>'''

          # Remove any previous copies of these handlers to avoid duplicate definitions.
          slip = re.sub(
              r'<script>\s*function cetakSlipGaji\(\).*?</script>',
              '',
              slip,
              flags=re.DOTALL,
          )

          if "</body></html>" not in slip:
              raise SystemExit("::error::Titik penyisipan handler slip gaji tidak ditemukan.")

          slip = slip.replace("</body></html>", handlers + "</body></html>", 1)
          source = source[:match.start()] + prefix + slip + suffix + source[match.end():]
          path.write_text(source, encoding="utf-8")

          check = path.read_text(encoding="utf-8")
          required = [
              'onclick="cetakSlipGaji()"',
              'onclick="tutupSlipGaji()"',
              "function cetakSlipGaji()",
              "function tutupSlipGaji()",
          ]
          missing = [token for token in required if token not in check]
          if missing:
              raise SystemExit("::error::Patch tombol slip gaji tidak lengkap: " + ", ".join(missing))

          print("Handler tombol slip gaji berhasil dipasang pada salinan HTML APK.")

          PY

          for item in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/src/main/res/mipmap-$item"
          done

          convert "$ICON_FILE" -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert "$ICON_FILE" -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert "$ICON_FILE" -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert "$ICON_FILE" -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert "$ICON_FILE" -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KarajoyHRManagement"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          org.gradle.caching=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.karajoy.hr'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.karajoy.hr'
                  minSdk 23
                  targetSdk 28
                  versionCode 3
                  versionName '1.2'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#D4AF37</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Karajoy HR Management"
                  android:theme="@style/AppTheme"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
                    cat > app/src/main/java/com/karajoy/hr/MainActivity.java <<'EOF'
          package com.karajoy.hr;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Context;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Message;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.view.ViewGroup;
          import android.webkit.JavascriptInterface;
          import android.webkit.JsPromptResult;
          import android.webkit.JsResult;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.EditText;
          import android.widget.FrameLayout;

          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {
              private WebView mainWebView;
              private FrameLayout rootLayout;
              private final List<WebView> popupWebViews = new ArrayList<>();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.BLACK);
                  getWindow().setNavigationBarColor(Color.BLACK);

                  rootLayout = new FrameLayout(this);
                  rootLayout.setBackgroundColor(Color.WHITE);

                  mainWebView = createWebView(false);
                  rootLayout.addView(mainWebView, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  ));

                  setContentView(rootLayout);
                  mainWebView.loadUrl("file:///android_asset/index.html");
              }

              private WebView createWebView(boolean isPopup) {
                  WebView view = new WebView(this);
                  view.setBackgroundColor(Color.WHITE);

                  WebSettings settings = view.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setSupportMultipleWindows(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  view.addJavascriptInterface(
                      new AndroidHost(view, isPopup),
                      "AndroidHost"
                  );

                  view.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView finishedView, String url) {
                          super.onPageFinished(finishedView, url);

                          if (isPopup) {
                              finishedView.evaluateJavascript(
                                  "try{" +
                                  "window.print=function(){AndroidHost.printPage();};" +
                                  "window.close=function(){AndroidHost.closeWindow();};" +
                                  "}catch(e){}",
                                  null
                              );
                          }
                      }
                  });

                  view.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onCreateWindow(
                          WebView parent,
                          boolean isDialog,
                          boolean isUserGesture,
                          Message resultMsg
                      ) {
                          WebView popup = createWebView(true);
                          popupWebViews.add(popup);

                          rootLayout.addView(popup, new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.MATCH_PARENT
                          ));
                          popup.bringToFront();

                          WebView.WebViewTransport transport =
                              (WebView.WebViewTransport) resultMsg.obj;
                          transport.setWebView(popup);
                          resultMsg.sendToTarget();
                          return true;
                      }

                      @Override
                      public void onCloseWindow(WebView window) {
                          closePopup(window);
                      }

                      @Override
                      public boolean onJsAlert(
                          WebView source,
                          String url,
                          String message,
                          JsResult result
                      ) {
                          new AlertDialog.Builder(MainActivity.this)
                              .setTitle("Karajoy HR")
                              .setMessage(message)
                              .setPositiveButton("OK",
                                  (dialog, which) -> result.confirm())
                              .setOnCancelListener(dialog -> result.cancel())
                              .show();
                          return true;
                      }

                      @Override
                      public boolean onJsConfirm(
                          WebView source,
                          String url,
                          String message,
                          JsResult result
                      ) {
                          new AlertDialog.Builder(MainActivity.this)
                              .setTitle("Konfirmasi")
                              .setMessage(message)
                              .setPositiveButton("Ya",
                                  (dialog, which) -> result.confirm())
                              .setNegativeButton("Batal",
                                  (dialog, which) -> result.cancel())
                              .setOnCancelListener(dialog -> result.cancel())
                              .show();
                          return true;
                      }

                      @Override
                      public boolean onJsPrompt(
                          WebView source,
                          String url,
                          String message,
                          String defaultValue,
                          JsPromptResult result
                      ) {
                          EditText input = new EditText(MainActivity.this);
                          input.setSingleLine(true);
                          input.setText(defaultValue == null ? "" : defaultValue);

                          new AlertDialog.Builder(MainActivity.this)
                              .setTitle("Karajoy HR")
                              .setMessage(message)
                              .setView(input)
                              .setPositiveButton("OK",
                                  (dialog, which) ->
                                      result.confirm(input.getText().toString()))
                              .setNegativeButton("Batal",
                                  (dialog, which) -> result.cancel())
                              .setOnCancelListener(dialog -> result.cancel())
                              .show();
                          return true;
                      }
                  });

                  return view;
              }

              private void printWebView(WebView target) {
                  if (target == null || isFinishing()) {
                      return;
                  }

                  runOnUiThread(() -> {
                      PrintManager manager =
                          (PrintManager) getSystemService(Context.PRINT_SERVICE);

                      if (manager == null) {
                          new AlertDialog.Builder(MainActivity.this)
                              .setTitle("Cetak slip gaji")
                              .setMessage(
                                  "Layanan cetak Android tidak tersedia pada perangkat ini."
                              )
                              .setPositiveButton("OK", null)
                              .show();
                          return;
                      }

                      String jobName = "Karajoy HR - Slip Gaji";

                      PrintAttributes attributes =
                          new PrintAttributes.Builder()
                              .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                              .setResolution(new PrintAttributes.Resolution(
                                  "karajoy_hr",
                                  "Karajoy HR",
                                  300,
                                  300
                              ))
                              .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                              .build();

                      manager.print(
                          jobName,
                          target.createPrintDocumentAdapter(jobName),
                          attributes
                      );
                  });
              }

              private WebView getTopPopup() {
                  if (popupWebViews.isEmpty()) {
                      return null;
                  }
                  return popupWebViews.get(popupWebViews.size() - 1);
              }

              private void closePopup(WebView popup) {
                  if (popup == null) {
                      return;
                  }

                  runOnUiThread(() -> {
                      if (!popupWebViews.remove(popup)) {
                          return;
                      }

                      if (popup.getParent() instanceof ViewGroup) {
                          ((ViewGroup) popup.getParent()).removeView(popup);
                      }

                      popup.stopLoading();
                      popup.removeJavascriptInterface("AndroidHost");
                      popup.destroy();

                      WebView next = getTopPopup();
                      if (next != null) {
                          next.bringToFront();
                      } else if (mainWebView != null) {
                          mainWebView.bringToFront();
                      }
                  });
              }

              private class AndroidHost {
                  private final WebView target;
                  private final boolean popup;

                  AndroidHost(WebView target, boolean popup) {
                      this.target = target;
                      this.popup = popup;
                  }

                  @JavascriptInterface
                  public void printPage() {
                      runOnUiThread(() -> printWebView(target));
                  }

                  @JavascriptInterface
                  public void printSlip() {
                      runOnUiThread(() -> {
                          WebView active = getTopPopup();
                          if (active != null) {
                              printWebView(active);
                          } else {
                              printWebView(popup ? target : mainWebView);
                          }
                      });
                  }

                  @JavascriptInterface
                  public void closeWindow() {
                      if (popup) {
                          closePopup(target);
                      } else {
                          closeSlip();
                      }
                  }

                  @JavascriptInterface
                  public void closeSlip() {
                      runOnUiThread(() -> {
                          WebView active = getTopPopup();
                          if (active != null) {
                              closePopup(active);
                          }
                      });
                  }
              }

              @Override
              public void onBackPressed() {
                  WebView active = getTopPopup();

                  if (active != null) {
                      closePopup(active);
                  } else if (mainWebView != null && mainWebView.canGoBack()) {
                      mainWebView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  for (WebView popup : new ArrayList<>(popupWebViews)) {
                      if (popup.getParent() instanceof ViewGroup) {
                          ((ViewGroup) popup.getParent()).removeView(popup);
                      }
                      popup.stopLoading();
                      popup.removeJavascriptInterface("AndroidHost");
                      popup.destroy();
                  }

                  popupWebViews.clear();

                  if (mainWebView != null) {
                      mainWebView.removeJavascriptInterface("AndroidHost");
                      mainWebView.destroy();
                      mainWebView = null;
                  }

                  super.onDestroy();
              }
          }
          EOF
                    cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Karajoy HR Management</string>
          </resources>
          EOF

      - name: Build debug APK
        shell: bash
        env:
          GRADLE_OPTS: "-Xmx3g -XX:MaxMetaspaceSize=1g"
        run: |
          set -euo pipefail
          gradle assembleDebug --no-daemon --max-workers=2 --stacktrace

      - name: Verify APK and patched buttons
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test -s "$APK"

          grep -q 'onclick="cetakSlipGaji()"' app/src/main/assets/index.html
          grep -q 'onclick="tutupSlipGaji()"' app/src/main/assets/index.html
          grep -q 'public void printPage()' app/src/main/java/com/karajoy/hr/MainActivity.java
          grep -q 'public void closeWindow()' app/src/main/java/com/karajoy/hr/MainActivity.java

          ls -lh "$APK"
          echo "APK berhasil dibuat dan handler tombol slip gaji ditemukan."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Karajoy-HR-Management-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
