name: Build Karajoy HR Management APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-android.yml'
      - 'index.html'
      - 'karajoy_icon.png'
      - '**.js'
      - '**.css'

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check required files
        run: |
          test -f index.html
          test -f karajoy_icon.png
          echo "HTML and launcher icon found"

      - name: Build APK
        run: |
          mkdir -p output
          echo "Project HTML is ready."
          echo "A complete Android Gradle project is required to build the APK."
