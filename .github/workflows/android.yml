name: Build Karajoy HR Management APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick unzip rsync
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q gradle-8.9-bin.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Verify HR files
        shell: bash
        run: |
          set -e

          HTML_FILE="Karajoy_HR_System_Opening_Video_AutoPlay_Fix.html"
          ICON_FILE="Karajoy_icon.png"

          if [[ ! -f "$HTML_FILE" ]]; then
            echo "::error::File HTML utama tidak ditemukan."
            find . -maxdepth 5 -type f -iname '*.html' \
              -not -path './.git/*' -print
            exit 1
          fi

          if [[ ! -f "$ICON_FILE" ]]; then
            echo "::error::Ikon Karajoy_icon.png tidak ditemukan."
            exit 1
          fi

          echo "HTML_FILE=$HTML_FILE" >> "$GITHUB_ENV"
          echo "ICON_FILE=$ICON_FILE" >> "$GITHUB_ENV"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/karajoy/hr
          mkdir -p app/src/main/res/values

          rsync -a ./ app/src/main/assets/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='app/' \
            --exclude='build/' \
            --exclude='.gradle/' \
            --exclude='*.yml' \
            --exclude='*.yaml' \
            --exclude='gradle.properties'

          cp "$HTML_FILE" app/src/main/assets/index.html

          for item in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/src/main/res/mipmap-$item"
          done

          convert "$ICON_FILE" -resize 48x48 \
            app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert "$ICON_FILE" -resize 72x72 \
            app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert "$ICON_FILE" -resize 96x96 \
            app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert "$ICON_FILE" -resize 144x144 \
            app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert "$ICON_FILE" -resize 192x192 \
            app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KarajoyHRManagement"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          org.gradle.caching=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.karajoy.hr'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.karajoy.hr'
                  minSdk 23
                  targetSdk 28
                  versionCode 2
                  versionName '1.1'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#D4AF37</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
          </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="Karajoy HR Management"
                  android:theme="@style/AppTheme"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/karajoy/hr/MainActivity.java <<'EOF'
          package com.karajoy.hr;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.JsResult;
          import android.webkit.JsPromptResult;
          import android.widget.EditText;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.BLACK);
                  getWindow().setNavigationBarColor(Color.BLACK);

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.WHITE);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onJsAlert(
                              WebView view, String url,
                              String message, JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                              .setTitle("Karajoy HR")
                              .setMessage(message)
                              .setPositiveButton("OK",
                                  (dialog, which) -> result.confirm())
                              .setOnCancelListener(
                                  dialog -> result.cancel())
                              .show();
                          return true;
                      }

                      @Override
                      public boolean onJsConfirm(
                              WebView view, String url,
                              String message, JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                              .setTitle("Konfirmasi")
                              .setMessage(message)
                              .setPositiveButton("Ya",
                                  (dialog, which) -> result.confirm())
                              .setNegativeButton("Batal",
                                  (dialog, which) -> result.cancel())
                              .setOnCancelListener(
                                  dialog -> result.cancel())
                              .show();
                          return true;
                      }

                      @Override
                      public boolean onJsPrompt(
                              WebView view, String url,
                              String message, String defaultValue,
                              JsPromptResult result) {
                          EditText input = new EditText(MainActivity.this);
                          input.setSingleLine(true);
                          input.setText(
                              defaultValue == null ? "" : defaultValue);

                          new AlertDialog.Builder(MainActivity.this)
                              .setTitle("Karajoy HR")
                              .setMessage(message)
                              .setView(input)
                              .setPositiveButton("OK",
                                  (dialog, which) ->
                                      result.confirm(
                                          input.getText().toString()))
                              .setNegativeButton("Batal",
                                  (dialog, which) -> result.cancel())
                              .setOnCancelListener(
                                  dialog -> result.cancel())
                              .show();
                          return true;
                      }
                  });

                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Build debug APK
        env:
          GRADLE_OPTS: "-Xmx3g -XX:MaxMetaspaceSize=1g"
        run: |
          gradle assembleDebug \
            --no-daemon \
            --max-workers=2 \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          echo "APK berhasil dibuat."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Karajoy-HR-Management-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
